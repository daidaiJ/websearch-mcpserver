# PR / push 级验证：构建、vet、短测、race 检测、静态检查与工作流 lint。
# 网络集成测试由 -short 跳过（详见 AGENTS.md 测试约定）；
# tag 发布走 release.yml / docker.yml / go-module-cache.yml，与本工作流互不影响。
# npm-plugin-check 只做模板结构与占位二进制的 npm pack --dry-run，不发布。
name: CI

on:
  push:
    branches: [master]
    # 纯文档/资源推送不参与构建。用宽通配而不是逐文件白名单，新增文档目录无需再改
    # 本清单。只有全部改动路径都命中才跳过，文档 + 代码的混合提交照常触发。
    #   - `**.md` 会连带忽略 npm/ 下的 README（check-credentials.sh 的扫描目标）。该
    #     护栏在 npm-plugin.yml 的发布流程里同样先于 publish 执行，明文凭据仍进不了已
    #     发布的 tarball；`paths-ignore` 不支持 `!` 再包含，这是唯一的取舍。
    #   - 图片只忽略仓库根目录（`*` 不跨目录）：`**/*.png` 之类的宽通配不能加，
    #     cmd/assets/*.ico 与 pkg/dashboard/web/logo-*.png 是 go:embed 的编译输入。
    #   - 若将来给 master 开分支保护并把本工作流设为必需检查，被跳过的文档提交会停在
    #     pending 而阻塞合并（GitHub 的路径过滤按文件而非按 job，无法只跳 test job）。
    paths-ignore: &docs-only
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - 'skills/**'
      - '*.png'
      - '*.svg'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - '*.webp'
      - '*.txt'
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build / vet / test (short, race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 内置缓存命中 primary key 后就不再回写，GOCACHE 会冻结在首次构建，
          # -race / -fuzz 的插桩产物每次都从零重编。下面两个步骤改为显式恢复：
          # 模块缓存只读共用生产者，构建缓存走滚动键累积。
          cache: false

      # 与 release.yml / go-module-cache.yml 保持完全一致的路径与键（生产者是
      # go-module-cache.yml 的 master 运行），此处只恢复、不重复上传。
      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-v1-${{ hashFiles('go.mod', 'go.sum') }}

      # 滚动键 + 前缀回退：每次运行都写一份新的 GOCACHE，供下一次运行命中前缀。
      # run_number 保证键唯一（有变化就保存），restore-keys 保证总能拿到上一份。
      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (short mode)
        run: go test -short ./...

      # hybrid/apipool/进度聚合都是多 goroutine 热区，竞态在普通测试下不可见。
      - name: Test (short mode, race detector)
        run: go test -race -short ./...

      # SSRF 预检是纯函数：种子语料常驻，PR 上跑短窗口模糊测试防回归。
      - name: Fuzz SSRF guards (short window)
        run: |
          go test -run=^$ -fuzz=FuzzValidateURLSecurity -fuzztime=10s ./mcp/
          go test -run=^$ -fuzz=FuzzIsPublicIP -fuzztime=10s ./mcp/
          go test -run=^$ -fuzz=FuzzIsPrivateHostFast -fuzztime=10s ./mcp/

      # 只在 master 推送时回写，PR 走只读恢复：避免每个 PR 都新增一份缓存
      # 条目、把 10GB 配额的历史挤掉（PR 分支的 GOCACHE 也无法被其他 PR 复用）。
      # 重跑同一次运行（run_number 不变）时 primary key 已存在，跳过保存而不是失败。
      - name: Save Go build cache
        if: github.ref == 'refs/heads/master' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  lint:
    name: golangci-lint (new issues)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --new-from-rev 需要基线提交在本地历史中。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 历史存量问题分批还，CI 先只拦新增代码：PR 对比 base，push 对比上一提交。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: >-
            --timeout=10m
            --new-from-rev=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  npm-plugin-check:
    name: npm / dsh plugin templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PR 也拦一次：这个 job 本身不接触任何 secret，只确保没人把明文
      # token / .npmrc 混进会被发布的包模板里。
      - name: Credential leak guard
        run: bash npm/scripts/check-credentials.sh

      # 模板结构 + 占位二进制走完整 npm pack --dry-run：不发网络请求、不发布，
      # 但能提前抓到 files 漏 cordis.patch.yml、平台 os/cpu 写错、生命周期脚本
      # 混进来、shim 语法错这类「只有发版当天才发现」的问题。
      - name: Structural checks
        run: bash npm/scripts/check.sh

      - name: Dry-run pack
        env:
          TAG: v0.0.0
          DRY_RUN: 'true'
          FAKE_BINARIES: 'true'
        run: bash npm/scripts/publish.sh
