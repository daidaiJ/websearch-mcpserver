# PR / push 级验证：构建、vet、短测与工作流 lint。
# 网络集成测试由 -short 跳过（详见 AGENTS.md 测试约定）；
# tag 发布走 release.yml / docker.yml / go-module-cache.yml，与本工作流互不影响。
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build / vet / test (short)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (short mode)
        run: go test -short ./...

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
