# Release workflow — 参考 2native-ssh-mcp 已验证实现（v1.4.1 成功发布）。
#
# 发布矩阵拆分（三套独立，不要合并成 6 平台）：
#   GitHub Release 二进制：linux/amd64, windows/amd64, darwin/amd64, darwin/arm64
#   GHCR 镜像（docker.yml）：linux/amd64, linux/arm64
#   MCP Registry mcpb：跟 Release 四平台封包（--expect-packages 4）
# linux-arm64 容器走 GHCR；不要为了「对齐 MCP/Docker」把 linux-arm64 / windows-arm64 加回本矩阵。
#
# 打 tag 约定（两步，不要一起推）：
#   1. 普通 tag v3.x.y → 本工作流发 GitHub Release；docker.yml 同时推 GHCR 镜像
#   2. 等 Release 产物就绪后，再单独打 v3.x.y-registry → 只跑 publish-registry（MCP Registry）
#   后补的 registry tag 钉同一 commit（只多跑封包/发布 job）
#
# Trigger: push an annotated tag (git tag -a v3.4.0 -m "...")
#   - builds server + cli binaries for the Release 四平台 (CGO_ENABLED=0)
#   - injects the tag name as the binary version (-X main.version=<tag>)
#   - release notes = the annotated tag message (read via GitHub API)
#   - attaches every binary with its own .sha256 checksum
#   - plain tags (v3.4.0) only build the Release here: no MCPB packaging
#   - GHCR 镜像在独立工作流 docker.yml 中随普通 tag 推送，不与本流程互相阻塞
#   - a follow-up tag with the "-registry" suffix (e.g. v3.4.0-registry),
#     pushed only after the base Release exists:
#     downloads the base release binaries, packages them as .mcpb bundles
#     (MCP Bundle, zip + manifest.json) via mcpb-tool-cli, creates its OWN
#     GitHub Release (the "-registry" tag) holding ONLY the .mcpb bundles,
#     and publishes the server to the official MCP Registry
#     (registry.modelcontextprotocol.io) via OIDC.
#     server.json download URLs point at the -registry release, so the base
#     release keeps binaries only and the two artifact families stay separate.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.arch }}
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            ext: .exe
          - goos: linux
            arch: amd64
            ext: ''
          - goos: darwin
            arch: amd64
            ext: ''
          - goos: darwin
            arch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/websearch-mcp-cli-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            dist/websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
            dist/websearch-mcp-cli-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release notes come from the annotated tag message, read via the
      # GitHub API. The local checkout may only hold a lightweight tag ref,
      # whose %(contents) falls back to the commit message, so local git
      # cannot be trusted here.
      - name: Read tag message
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/${{ github.ref_name }}")"
          TYPE="$(echo "$REF" | jq -r '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(echo "$REF" | jq -r '.object.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.message' > notes.md
          else
            echo "${{ github.ref_name }}" > notes.md
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: websearch-*

      - name: Generate checksums
        run: |
          cd dist
          for f in websearch-mcpserver-* websearch-mcp-cli-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          # 预览 tag（如 v3.6.0-preview.1）自动标记 Pre-release，不占正式版本号
          PRERELEASE_FLAG=""
          case "${{ github.ref_name }}" in
            *-preview*|*-rc*|*-beta*|*-alpha*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            dist/websearch-mcpserver-* dist/websearch-mcp-cli-* \
            $PRERELEASE_FLAG \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md

  publish-registry:
    name: Publish to MCP Registry
    # 发完普通 tag 后再单独打 "-registry" 后缀（如 v3.4.0-registry）。
    # 依赖已存在的稳定版 Release（v3.4.0），只发布到官方 MCP Registry。
    if: ${{ endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # 为 -registry tag 创建 Release 并上传 .mcpb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # MCPB 封包只发生在 -registry 流程：从 base release 拉服务端二进制，
      # 现场打包 .mcpb（base release 不承载 mcpb，两类产物分开）
      - name: Package MCPB bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v3.1.1-registry
          BASE_TAG="${TAG%-registry}"             # v3.1.1
          echo "Packaging MCPB bundles for $BASE_TAG"
          mkdir -p dist mcpb-assets
          gh release download "$BASE_TAG" \
            --pattern "websearch-mcpserver-*" --dir dist

          go install github.com/daidaiJ/mcpb-tool-cli@latest
          # go install 产物在 GOPATH/bin（不在 runner PATH），且二进制名为 mcpb-tool-cli
          MCPB="$(go env GOPATH)/bin/mcpb-tool-cli"
          # MCP 跟 GitHub Release 四平台：linux/windows amd64 + darwin amd64/arm64。
          # 缺文件跳过是兜底；正常应正好 4 个 mcpb（--expect-packages 4）。
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              bin="dist/websearch-mcpserver-$os-$arch$ext"
              [ -f "$bin" ] || continue
              "$MCPB" pack \
                --binary "$bin" \
                --name websearch-mcpserver \
                --display "WebSearch MCP Server" \
                --version "$BASE_TAG" \
                --description "Zero-API-key MCP search server: multi-engine web/academic search, PDF parsing, secure web fetch" \
                --author daidaiJ \
                --os "$os" \
                --arch "$arch" \
                --out mcpb-assets
            done
          done
          ls -la mcpb-assets

      - name: Create registry release with MCPB bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BASE_TAG="${TAG%-registry}"
          # mcpb 落到 -registry tag 自己的 Release（与 base Release 的二进制分开），
          # server.json 的下载链接指向这里（--base-tag "$TAG"）
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            mcpb-assets/*.mcpb mcpb-assets/*.mcpb.sha256 \
            --title "$TAG (MCP Registry bundles)" \
            --notes "MCP Registry 专用打包产物（.mcpb + sha256）。服务端/CLI 二进制与其校验和见 [$BASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$BASE_TAG) Release。"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Generate server.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v3.1.1-registry
          BASE_TAG="${TAG%-registry}"             # v3.1.1
          VERSION="${BASE_TAG#v}"                 # 3.1.1
          go install github.com/daidaiJ/mcpb-tool-cli@latest
          "$(go env GOPATH)/bin/mcpb-tool-cli" serverjson \
            --dir mcpb-assets \
            --name io.github.daidaiJ/websearch-mcpserver \
            --title "WebSearch MCP Server" \
            --description "Zero-API-key MCP search server: multi-engine web/academic search, PDF parsing, secure web fetch" \
            --version "$VERSION" \
            --repo-url https://github.com/daidaiJ/websearch-mcpserver \
            --base-tag "$TAG" \
            --expect-packages 4 \
            --out server.json
          echo "--- server.json ---"
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify registration
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG%-registry}"
          VERSION="${VERSION#v}"
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=websearch-mcpserver" \
            | jq -e --arg v "$VERSION" \
              '.servers[] | select(.server.name == "io.github.daidaiJ/websearch-mcpserver" and .server.version == $v)' \
            > /dev/null
          echo "✅ registered: io.github.daidaiJ/websearch-mcpserver $VERSION"


