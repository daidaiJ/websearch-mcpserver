# Release workflow — 参考 2native-ssh-mcp 已验证实现（v1.4.1 成功发布）。
#
# Trigger: push an annotated tag (git tag -a v3.1.1 -m "...")
#   - builds server + cli binaries for windows/linux amd64 and darwin amd64/arm64
#     (CGO_ENABLED=0)
#   - injects the tag name as the binary version (-X main.version=<tag>)
#   - release notes = the annotated tag message (read via GitHub API)
#   - attaches every binary with its own .sha256 checksum
#   - plain tags (v3.1.1) only build the release: no MCPB packaging, no CLI download
#   - plain tags additionally build & push a linux/amd64 Docker image
#     to ghcr.io/<owner>/websearch-mcpserver, tagged with semver + latest
#   - a tag with the "-registry" suffix (e.g. v3.1.1-registry) additionally:
#     downloads the base release binaries, packages them as .mcpb bundles
#     (MCP Bundle, zip + manifest.json) via mcpb-tool-cli, uploads the bundles
#     back to the base release, and publishes it to the official MCP Registry
#     (registry.modelcontextprotocol.io) via OIDC.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.arch }}
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            ext: .exe
          - goos: linux
            arch: amd64
            ext: ''
          - goos: darwin
            arch: amd64
            ext: ''
          - goos: darwin
            arch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/websearch-mcp-cli-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            dist/websearch-mcpserver-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
            dist/websearch-mcp-cli-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release notes come from the annotated tag message, read via the
      # GitHub API. The local checkout may only hold a lightweight tag ref,
      # whose %(contents) falls back to the commit message, so local git
      # cannot be trusted here.
      - name: Read tag message
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/${{ github.ref_name }}")"
          TYPE="$(echo "$REF" | jq -r '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(echo "$REF" | jq -r '.object.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.message' > notes.md
          else
            echo "${{ github.ref_name }}" > notes.md
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in websearch-mcpserver-* websearch-mcp-cli-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            dist/websearch-mcpserver-* dist/websearch-mcp-cli-* \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md

  docker:
    name: Build & push GHCR image
    # 与 build/release 并行（镜像从源码构建，不依赖二进制产物）；
    # -registry tag 不重复构建镜像
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action 会自动转小写（GHCR 仓库名不含大写字母）
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # 仅非预发布版本追加 latest
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-registry:
    name: Publish to MCP Registry
    # Triggered only by a "-registry" suffix tag (e.g. v3.1.1-registry).
    # Publishes the matching stable release (v3.1.1) to the official registry.
    if: ${{ endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # gh release upload 回传 .mcpb 到 base release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # MCPB 封包只发生在 -registry 流程：从 base release 拉服务端二进制，
      # 现场打包 .mcpb 后回传到 base release（server.json 的下载链接指向那里）
      - name: Package MCPB bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v3.1.1-registry
          BASE_TAG="${TAG%-registry}"             # v3.1.1
          echo "Packaging MCPB bundles for $BASE_TAG"
          mkdir -p dist mcpb-assets
          gh release download "$BASE_TAG" \
            --pattern "websearch-mcpserver-*" --dir dist

          go install github.com/daidaiJ/mcpb-tool-cli@latest
          # go install 产物在 GOPATH/bin（不在 runner PATH），且二进制名为 mcpb-tool-cli
          MCPB="$(go env GOPATH)/bin/mcpb-tool-cli"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              "$MCPB" pack \
                --binary "dist/websearch-mcpserver-$os-$arch$ext" \
                --name websearch-mcpserver \
                --display "WebSearch MCP Server" \
                --version "$BASE_TAG" \
                --description "Zero-API-key MCP search server: multi-engine web/academic search, PDF parsing, secure web fetch" \
                --author daidaiJ \
                --os "$os" \
                --arch "$arch" \
                --out mcpb-assets
            done
          done
          ls -la mcpb-assets

      - name: Upload MCPB bundles to base release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BASE_TAG="${TAG%-registry}"
          gh release upload "$BASE_TAG" \
            mcpb-assets/*.mcpb mcpb-assets/*.mcpb.sha256 --clobber

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Generate server.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v3.1.1-registry
          BASE_TAG="${TAG%-registry}"             # v3.1.1
          VERSION="${BASE_TAG#v}"                 # 3.1.1
          go install github.com/daidaiJ/mcpb-tool-cli@latest
          "$(go env GOPATH)/bin/mcpb-tool-cli" serverjson \
            --dir mcpb-assets \
            --name io.github.daidaiJ/websearch-mcpserver \
            --title "WebSearch MCP Server" \
            --description "Zero-API-key MCP search server: multi-engine web/academic search, PDF parsing, secure web fetch" \
            --version "$VERSION" \
            --repo-url https://github.com/daidaiJ/websearch-mcpserver \
            --base-tag "$BASE_TAG" \
            --expect-packages 6 \
            --out server.json
          echo "--- server.json ---"
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify registration
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG%-registry}"
          VERSION="${VERSION#v}"
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=websearch-mcpserver" \
            | jq -e --arg v "$VERSION" \
              '.servers[] | select(.server.name == "io.github.daidaiJ/websearch-mcpserver" and .server.version == $v)' \
            > /dev/null
          echo "✅ registered: io.github.daidaiJ/websearch-mcpserver $VERSION"