# GHCR 多架构镜像 — 与 CLI/二进制 Release、MCP Registry 拆开，互不阻塞。
#
# 发布矩阵拆分：本工作流只构建容器 linux/amd64 + linux/arm64（closes #4）。
# GitHub Release 不含 linux-arm64 / windows-arm64 二进制；MCP mcpb 跟 Release 四平台。
#
# Trigger: 普通 semver tag（v3.4.0）推 GHCR；发完后再打的 -registry 后缀不重复推镜像
#   - Go 交叉编译在 Dockerfile BUILDPLATFORM 阶段完成，不装 QEMU
#   - 失败不影响 GitHub Release / MCP Registry 工作流

name: Docker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push GHCR image
    # -registry 后缀不重复推镜像；预览 tag（如 v3.6.0-preview.1）不推官方镜像
    if: ${{ !endsWith(github.ref_name, '-registry') && !contains(github.ref_name, '-preview') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action 会自动转小写（GHCR 仓库名不含大写字母）
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 无 QEMU：builder/certs 阶段跑在 runner 上交叉编译，最终 alpine 只有 COPY
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
