# GHCR 多架构镜像 — 与 CLI/二进制 Release、MCP Registry 拆开，互不阻塞。
#
# 发布矩阵拆分：本工作流只构建容器 linux/amd64 + linux/arm64（closes #4）。
# GitHub Release 不含 linux-arm64 / windows-arm64 二进制；MCP mcpb 跟 Release 四平台。
#
# Trigger: 普通 semver tag（v3.4.0）推 GHCR；发完后再打的 -registry / -npm
#   后缀不重复推镜像（前者发 MCP Registry，后者发 npm 包，都只复用 base Release 产物）
#   - Go 交叉编译在 Dockerfile BUILDPLATFORM 阶段完成；QEMU 仅用于安装 qpdf
#   - 失败不影响 GitHub Release / MCP Registry 工作流

name: Docker

on:
  push:
    tags:
      - 'v*'
      - '!v*-registry'
      - '!v*-preview*'
      - '!v*-npm'
  # 补发 / 重跑某个版本的镜像。版本必须是普通 semver tag（如 v3.10.7）；
  # 不用于 -registry / -npm / 预览 tag。
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v3.10.7)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push GHCR image
    # -registry / -npm 后缀不重复推镜像；预览 tag（如 v3.6.0-preview.1）不推官方镜像
    if: ${{ !endsWith(github.ref_name, '-registry') && !contains(github.ref_name, '-preview') && !endsWith(github.ref_name, '-npm') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for qpdf runtime package
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求仓库名全小写；metadata-action 会转小写，但 cache ref 不会，
      # 这里统一解析一次。
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Go 仍在 runner 上交叉编译；运行镜像用 QEMU 安装目标架构的 qpdf
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 本工作流只由 tag / 手动补发触发，而 type=gha 的缓存按 ref 隔离、tag 之间互不可见
          # （master 不跑 Docker，也没有可回退的分支作用域）。实测连续三个 tag 导入的
          # cache manifest 各不相同、零命中，且 69 个 buildkit 条目白占约 2.4GB 配额。
          # 改用镜像仓库作缓存后端：跨 tag 共享，且完全不占 Actions 缓存配额。
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
