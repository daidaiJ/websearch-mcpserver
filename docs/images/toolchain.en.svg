<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280">
  <title>A complete tool chain for LLMs</title>
  <desc>Search → academic retrieval → fetch source → parse PDF. One config enables the whole chain.</desc>
  <defs>
    <linearGradient id="toolEnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#0C1830"/>
    </linearGradient>
    <marker id="toolEnArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="toolEnArrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1100" height="280" rx="20" fill="#07101E"/>
  <rect x="1" y="1" width="1098" height="278" rx="19" fill="none" stroke="#1E2D4A" stroke-width="2"/>
  <text x="36" y="38" fill="#F1F5F9" font-size="18" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-weight="700">A complete tool chain for LLMs</text>
  <text x="36" y="60" fill="#8BA0BE" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Search → academic retrieval → fetch source → parse PDF. One config enables the whole chain.</text>
  <rect x="28" y="84" width="236" height="160" rx="14" fill="#0F2740" stroke="#155E75"/>
  <circle cx="52" cy="110" r="14" fill="#164E63"/>
  <text x="52" y="115" fill="#67E8F9" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="700">1</text>
  <text x="74" y="116" fill="#67E8F9" font-size="14" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-weight="700">smartsearch</text>
  <text x="48" y="148" fill="#E2E8F0" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Multi-engine search</text>
  <text x="48" y="170" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Local scoring · dedup · MMR</text>
  <text x="48" y="192" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Optional LLM summary</text>
  <text x="48" y="220" fill="#22D3EE" font-size="11" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Runs with zero API keys</text>
  <line x1="276" y1="164" x2="300" y2="164" stroke="#22D3EE" stroke-width="2" marker-end="url(#toolEnArrC)"/>
  <rect x="308" y="84" width="236" height="160" rx="14" fill="#1A1408" stroke="#B45309"/>
  <circle cx="332" cy="110" r="14" fill="#78350F"/>
  <text x="332" y="115" fill="#FCD34D" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="700">2</text>
  <text x="354" y="116" fill="#FCD34D" font-size="14" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-weight="700">academicsearch</text>
  <text x="328" y="148" fill="#E2E8F0" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">9 academic engines in parallel</text>
  <text x="328" y="170" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Citation / journal / PDF scoring</text>
  <text x="328" y="192" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Cross-engine DOI dedup</text>
  <text x="328" y="220" fill="#FBBF24" font-size="11" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Per-engine failure passthrough</text>
  <line x1="556" y1="164" x2="580" y2="164" stroke="#22D3EE" stroke-width="2" marker-end="url(#toolEnArrC)"/>
  <rect x="588" y="84" width="236" height="160" rx="14" fill="#0B1F18" stroke="#0F766E"/>
  <circle cx="612" cy="110" r="14" fill="#115E59"/>
  <text x="612" y="115" fill="#5EEAD4" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="700">3</text>
  <text x="634" y="116" fill="#5EEAD4" font-size="14" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-weight="700">cleanfetch</text>
  <text x="608" y="148" fill="#E2E8F0" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Enhanced web fetching</text>
  <text x="608" y="170" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">TLS fingerprint · SSRF guard</text>
  <text x="608" y="192" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">DNS-rebinding detection</text>
  <text x="608" y="220" fill="#2DD4BF" font-size="11" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Fallback to Jina Reader</text>
  <line x1="836" y1="164" x2="860" y2="164" stroke="#22D3EE" stroke-width="2" marker-end="url(#toolEnArrC)"/>
  <rect x="868" y="84" width="204" height="160" rx="14" fill="#1A1024" stroke="#6D28D9"/>
  <circle cx="892" cy="110" r="14" fill="#5B21B6"/>
  <text x="892" y="115" fill="#C4B5FD" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="700">4</text>
  <text x="914" y="116" fill="#C4B5FD" font-size="14" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-weight="700">pdf_parser</text>
  <text x="888" y="148" fill="#E2E8F0" font-size="13" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Local text extraction first</text>
  <text x="888" y="170" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">MinerU OCR for scans</text>
  <text x="888" y="192" fill="#94A3B8" font-size="12" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Tables / formulas / columns</text>
  <text x="888" y="220" fill="#A78BFA" font-size="11" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">Degrades without a token</text>
</svg>
